
services:
  jenkins:
    build: ./jenkins
    # Runs as root so builds can use the host Docker socket. Local interview use only.
    user: root
    ports: ["8080:8080"]
    environment:
      # Skip the setup wizard and allow checking out the repo mounted at /repo.
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/repo

  pushgateway:
    image: prom/pushgateway
    ports: ["9091:9091"]

  prometheus:
    image: prom/prometheus
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana
    ports: ["3000:3000"]
    environment:
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "smtp-relay.brevo.com:587"
      GF_SMTP_USER: "${GRAFANA_SMTP_USER}"
      GF_SMTP_PASSWORD: "${GRAFANA_SMTP_PASSWORD}"
      GF_SMTP_FROM_ADDRESS: "${GRAFANA_SMTP_FROM_ADDRESS}"
      GF_SMTP_FROM_NAME: "Grafana"
      GF_SMTP_STARTTLS_POLICY: "MandatoryStartTLS"
      GF_SMTP_SKIP_VERIFY: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  jenkins_home:
  grafana_data:
